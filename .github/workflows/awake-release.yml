name: Awake release

# Awake's build of T3 Code, in awake-computer/t3code. It builds the linux-x64 and linux-arm64 CLI
# archives that upstream's release.yml ships, and their SHA256SUMS, after the checks and test suites
# release.yml runs first, on GitHub's standard runners. A push to `awake` runs all of it but the
# publish. A tag `awake-v<upstream version>-<n>` on awake's history also publishes the archives as a
# release of this repository, stamped `<upstream version>-awake.<n>`.
#
# It keeps to release.yml and release-desktop.yml, step for step, so their changes are easy to carry
# over: the same scripts, flags and order, without the desktop apps, signing, npm, the AUR, T3
# Connect's relay state, or Blacksmith's runners and task cache. Every action is pinned by commit.

on:
  push:
    branches: [awake]
    tags: ["awake-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awake-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  preflight:
    name: Resolve version
    if: github.repository == 'awake-computer/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      upstream: ${{ steps.meta.outputs.upstream }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - id: meta
        name: Resolve the version from the ref
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ ! "$REF_NAME" =~ ^awake-v([0-9]+\.[0-9]+\.[0-9]+)-([1-9][0-9]*)$ ]]; then
              echo "A release tag is awake-v<upstream version>-<n>, such as awake-v0.1.7-1, not $REF_NAME." >&2
              exit 1
            fi
            echo "upstream=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}-awake.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            # A branch build is never published; its stamp only has to be a version the smoke test can find.
            echo "upstream=" >> "$GITHUB_OUTPUT"
            echo "version=0.0.0-awake.dev.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Release quality checks
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Typecheck
        run: vp run typecheck

  # The same package split and server shards as release.yml's test, test_web and test_server.
  test:
    name: Release tests
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config build-essential

      - name: Test
        run: vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/monorepo' --filter '!@t3tools/web' test

  test_web:
    name: Release web tests
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for web browser tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      - name: Test
        run: vp run --filter @t3tools/web test

      # Browser tests run source modules; this boots the production chunk graph.
      - name: Boot the built web client
        run: |
          vp run --filter @t3tools/web build
          node apps/web/scripts/verify-built-boot.ts

  test_server:
    name: Release server tests ${{ matrix.shard }}
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Install Chromium for server browser integration tests
        run: node apps/server/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium

      - name: Test
        run: vp run --filter t3 test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # The server bundle and the web client, built once and handed to both architectures, as
  # release.yml's build_bundle does. Only `t3` is built: there is no desktop app here.
  build_bundle:
    name: Build JS bundle
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      # The public identifiers upstream bakes into its official builds, which its preview releases
      # read from the same file. They are not secrets.
      - name: Load T3 Connect's public config
        shell: bash
        run: |
          set -euo pipefail
          env_example() { sed -n "s|^T3CODE_$1=||p" .env.example; }
          {
            echo "T3CODE_CLERK_PUBLISHABLE_KEY=$(env_example CLERK_PUBLISHABLE_KEY)"
            echo "T3CODE_CLERK_JWT_TEMPLATE=$(env_example CLERK_JWT_TEMPLATE)"
            echo "T3CODE_CLERK_CLI_OAUTH_CLIENT_ID=$(env_example CLERK_CLI_OAUTH_CLIENT_ID)"
            echo "T3CODE_RELAY_URL=$(env_example RELAY_URL)"
          } >> "$GITHUB_ENV"

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      # Builds in other repositories report "dev" telemetry, as release.yml has it.
      - name: Build JS bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run --filter t3 build

      - name: Upload JS bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-bundle
          path: apps/server/dist
          if-no-files-found: error
          retention-days: 1

  # release-desktop.yml's CLI archive steps, for Linux, each on hardware of its own architecture:
  # node-pty compiles from source there, and Linux arm64 builds only on a Linux arm64 host.
  cli:
    name: CLI archive linux-${{ matrix.arch }}
    needs: [preflight, build_bundle]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            resource_key: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      # The CLI archive installs its runtime packages without a lockfile, so it asks the registry
      # about each one. A new week starts cold, which bounds how stale cached ranges can get.
      - name: Resolve staged install cache
        id: stage_pnpm
        shell: bash
        run: |
          echo "dir=$RUNNER_TEMP/cli-stage-pnpm" >> "$GITHUB_OUTPUT"
          echo "prefix=cli-stage-pnpm-v1-linux-${{ matrix.arch }}-$(date -u +%G-%V)-" >> "$GITHUB_OUTPUT"

      - name: Restore staged install cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.stage_pnpm.outputs.dir }}
          key: ${{ steps.stage_pnpm.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.stage_pnpm.outputs.prefix }}

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor
          key: resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      # The executable bundles the server again, so it is built with the bundle's public config.
      - name: Load T3 Connect's public config
        shell: bash
        run: |
          set -euo pipefail
          env_example() { sed -n "s|^T3CODE_$1=||p" .env.example; }
          {
            echo "T3CODE_CLERK_PUBLISHABLE_KEY=$(env_example CLERK_PUBLISHABLE_KEY)"
            echo "T3CODE_CLERK_JWT_TEMPLATE=$(env_example CLERK_JWT_TEMPLATE)"
            echo "T3CODE_CLERK_CLI_OAUTH_CLIENT_ID=$(env_example CLERK_CLI_OAUTH_CLIENT_ID)"
            echo "T3CODE_RELAY_URL=$(env_example RELAY_URL)"
          } >> "$GITHUB_ENV"

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Download JS bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: js-bundle
          path: apps/server/dist

      - name: Build resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ matrix.rust_target }}"

      - name: Apply web client branding
        run: node scripts/apply-web-brand-assets.ts production apps/server/dist/client

      - name: Build CLI single-executable
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Stage resource monitor for the CLI archive
        shell: bash
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/cli-resource-monitor/${{ matrix.resource_key }}"
          mkdir -p "$target_dir"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor" "$target_dir/t3-resource-monitor"

      # The Linux archive ships libatomic.so.1 and points t3's RUNPATH at it.
      - name: Install patchelf
        run: command -v patchelf || { sudo apt-get update && sudo apt-get install -y patchelf; }

      - name: Build CLI archive
        shell: bash
        env:
          pnpm_config_cache_dir: ${{ steps.stage_pnpm.outputs.dir }}/cache
          pnpm_config_store_dir: ${{ steps.stage_pnpm.outputs.dir }}/store
          pnpm_config_prefer_offline: "true"
        run: |
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch "${{ matrix.arch }}" \
            --version "${{ needs.preflight.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.preflight.outputs.version }}"

      - name: Save staged install cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.stage_pnpm.outputs.dir }}
          key: ${{ steps.stage_pnpm.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload CLI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-linux-${{ matrix.arch }}
          path: release-cli/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [preflight, quality, test, test_web, test_server, cli]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /LICENSE
          sparse-checkout-cone-mode: false

      # A release is upstream's tagged release plus awake's own commits, and nothing else: the tagged
      # commit must be on awake, and upstream's tag of the version it names must be in its history.
      # Fetching upstream's tag is read-only.
      - name: Check what the tag builds
        id: history
        shell: bash
        env:
          UPSTREAM: ${{ needs.preflight.outputs.upstream }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin awake
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "$GITHUB_REF_NAME tags $GITHUB_SHA, which is not on awake." >&2
            exit 1
          fi
          git fetch --no-tags https://github.com/pingdotgg/t3code.git "refs/tags/v$UPSTREAM"
          base="$(git rev-parse FETCH_HEAD^{commit})"
          if ! git merge-base --is-ancestor "$base" "$GITHUB_SHA"; then
            echo "Upstream's v$UPSTREAM ($base) is not in $GITHUB_REF_NAME's history." >&2
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          {
            echo "Awake's build of T3 Code v$UPSTREAM ($base), from github.com/pingdotgg/t3code under its MIT license, with Awake's commits:"
            echo
            git log --reverse --format='- %h %s' "$base..$GITHUB_SHA"
            echo
            echo "Each archive carries T3 Code's LICENSE. Check an archive against SHA256SUMS before you use it."
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Download CLI archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      # Written from the bytes that are uploaded, as release.yml does.
      - name: Write CLI archive checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          archives=(t3-*.tar.gz)
          if [[ ${#archives[@]} -ne 2 ]]; then
            echo "Expected the linux-x64 and linux-arm64 archives, found: ${archives[*]:-none}" >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release-assets/t3-*.tar.gz release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Awake Code $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
